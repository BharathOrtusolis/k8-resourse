apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: nginx-rs
  labels:
    purpose: replicaset-demo

spec:
  replicas: 3
  selector:
    matchLabels:
      purpose: replicaset-demo
  template:
    metadata:
      labels:
        purpose: replicaset-demo
        project: roboshop
        environment: dev
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80